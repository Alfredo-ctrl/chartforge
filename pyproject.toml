[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chartforge"
version = "0.1.0"
description = "Charts built for AI agents. CLI, Python API and MCP server."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Alfredo Ramos"}]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.6",
    "Pillow>=10",
]

[project.scripts]
chartforge = "chartforge.cli:main"

[tool.setuptools.packages.find]
include = ["chartforge*"]
